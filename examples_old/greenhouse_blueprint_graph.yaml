# Minimal navigation graph for `examples/test_greenhouse_fleet_local.cpp`.
#
# Coordinates are in meters in a local 2D plane. The demo recenters the graph
# into the simulator world by shifting it by (-width/2, -length/2).

name: demo_greenhouse
dimensions:
  width: 30
  length: 20

nodes:
  - id: 1
    name: A
    x: 2
    y: 2
  - id: 2
    name: B
    x: 15
    y: 2
  - id: 3
    name: C
    x: 28
    y: 2
  - id: 4
    name: D
    x: 2
    y: 18
  - id: 5
    name: E
    x: 15
    y: 18
  - id: 6
    name: F
    x: 28
    y: 18

edges:
  - id: 100
    v1: 1
    v2: 2
    bidirectional: true
    type: main_path
  - id: 101
    v1: 2
    v2: 3
    bidirectional: true
    type: main_path
  - id: 102
    v1: 4
    v2: 5
    bidirectional: true
    type: main_path
  - id: 103
    v1: 5
    v2: 6
    bidirectional: true
    type: main_path
  - id: 200
    v1: 1
    v2: 4
    bidirectional: true
    type: cross
  - id: 201
    v1: 2
    v2: 5
    bidirectional: true
    type: cross
  - id: 202
    v1: 3
    v2: 6
    bidirectional: true
    type: cross

