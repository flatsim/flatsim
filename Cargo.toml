[workspace]
members = [
    "rust/flatsim-core",
    "rust/flatsim-ffi",
    "rust/flatsim-bind",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["Flatsim Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for future networking)
tokio = { version = "1.35", features = ["full"] }

# Parallelism
rayon = "1.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Math and numerics
nalgebra = "0.32"
rand = "0.8"

# FFI
cxx = "1.0"

# Testing
proptest = "1.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
