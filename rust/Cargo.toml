[package]
name = "flatsim"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Flatsim Team"]
license = "MIT OR Apache-2.0"

[dependencies]
# FFI - for calling C++ libraries
cxx = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math
nalgebra = "0.32"

[build-dependencies]
cxx-build = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
